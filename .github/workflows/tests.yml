name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py blindspot scripts tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke-test multi-camera fusion benchmark
        run: |
          python scripts/benchmark_fusion.py --cameras 2 --points-per-camera 1000 --repeats 1 --output /tmp/fusion_benchmark.json
          python -c "import json; report=json.load(open('/tmp/fusion_benchmark.json')); assert report['input_points'] == 2000 and report['output_points'] > 0"
      - name: Smoke-test reconstruction and trajectory benchmark APIs
        run: |
          python - <<'PY'
          import json
          import numpy as np
          poses = [np.eye(4).tolist(), np.eye(4).tolist()]
          with open('/tmp/estimated_poses.json', 'w', encoding='utf-8') as stream:
              json.dump(poses, stream)
          with open('/tmp/ground_truth_poses.json', 'w', encoding='utf-8') as stream:
              json.dump(poses, stream)
          from blindspot.pose_graph_se3 import optimize_pose_graph_se3
          from blindspot.registration import register_point_cloud_icp
          from blindspot.camera_rig import estimate_camera_rig_poses
          assert callable(optimize_pose_graph_se3) and callable(register_point_cloud_icp)
          assert callable(estimate_camera_rig_poses)
          PY
          python scripts/benchmark_trajectory.py --estimated /tmp/estimated_poses.json --ground-truth /tmp/ground_truth_poses.json --output /tmp/trajectory_benchmark.json
          python scripts/benchmark_depth.py --help > /dev/null
          python scripts/benchmark_quality.py --help > /dev/null
          python scripts/benchmark_tracking.py --help > /dev/null
          python scripts/benchmark_uncertainty.py --help > /dev/null
          python scripts/fuse_multicamera.py --help > /dev/null
          python scripts/reconstruct_point_cloud.py --help > /dev/null
          python -c "import json; report=json.load(open('/tmp/trajectory_benchmark.json')); assert report['ate_rmse'] == 0 and report['rpe_translation_rmse'] == 0"
      - name: Smoke-test Streamlit startup
        run: |
          python -m streamlit run app.py --server.headless=true --server.port=8501 > /tmp/blindspot-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8501/_stcore/health"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("Streamlit health endpoint is ready")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Streamlit did not become healthy within 30 seconds")
          PY
      - name: Build Docker image
        run: docker build -t blindspot-2:ci .
